name: vidstream

x-server: &server
  image: ${VIDSTREAM_IMAGE:?}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
    start_period: 60s

x-server-env: &server-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vidstream
  SPRING_DATASOURCE_USERNAME: vidstream
  SPRING_DATASOURCE_PASSWORD: ${VIDSTREAM_DB_PASSWORD:?}
  VIDSTREAM_TOKENKEY: ${VIDSTREAM_TOKEN_KEY:?}
  BOX_CLIENT_ID: ${BOX_CLIENT_ID:?}
  BOX_CLIENT_SECRET: ${BOX_CLIENT_SECRET:?}

x-ls-dev: &ls-dev
  image: vidstream-label-studio:1.23.2
  environment:
    DJANGO_DB: default
    POSTGRE_HOST: postgres
    POSTGRE_PORT: "5432"
    POSTGRE_NAME: ls_dev
    POSTGRE_USER: ls_dev
    POSTGRE_PASSWORD: ${LS_DEV_DB_PASSWORD:?}
    SECRET_KEY: ${LS_DEV_SECRET_KEY:?}
    LOCAL_FILES_SERVING_ENABLED: "true"
    LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    LABEL_STUDIO_HOST: https://dev.${VIDSTREAM_DOMAIN:?}
    LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    # No bundled nginx: uwsgi serves static and clip files (Range) itself.
    USE_NGINX_FOR_UPLOADS: "false"
    UWSGI_PROCESSES: "2"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      VIDSTREAM_DB_PASSWORD: ${VIDSTREAM_DB_PASSWORD:?}
      LS_DEV_DB_PASSWORD: ${LS_DEV_DB_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 30s

  web:
    <<: *server
    environment:
      <<: *server-env
      VIDSTREAM_ROLE: web
      VIDSTREAM_DATASETSFILE: file:/app/datasets.yml
      VIDSTREAM_DOMAIN: ${VIDSTREAM_DOMAIN:?}
    volumes:
      - ./datasets.yml:/app/datasets.yml:ro
    networks:
      default:
      hooks:
        aliases: [hooks.internal]

  worker:
    <<: *server
    environment:
      <<: *server-env
      VIDSTREAM_ROLE: worker

  # Builds the patched image (never pulled; it exists only locally) before any container starts.
  ls-dev-migrate:
    <<: *ls-dev
    build: ./label-studio
    pull_policy: build
    command: label-studio-migrate
    depends_on:
      postgres:
        condition: service_healthy

  ls-dev:
    <<: *ls-dev
    pull_policy: never
    command: label-studio-uwsgi
    restart: unless-stopped
    env_file: ./label-studio/ssrf.env
    volumes:
      - ls-dev:/label-studio/data
    networks: [default, hooks]
    depends_on:
      ls-dev-migrate:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1, not localhost: uwsgi listens on IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      start_period: 90s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      VIDSTREAM_DOMAIN: ${VIDSTREAM_DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, ls-dev]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]

networks:
  # Webhooks from Label Studio reach web only here; ssrf.env bans every other private range.
  hooks:
    internal: true
    ipam:
      config:
        - subnet: 192.168.250.0/29

volumes:
  postgres:
  ls-dev:
  caddy-data:
