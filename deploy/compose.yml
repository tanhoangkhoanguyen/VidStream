name: vidstream

x-server: &server
  image: ${VIDSTREAM_IMAGE:?}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
    start_period: 60s

x-server-env: &server-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vidstream
  SPRING_DATASOURCE_USERNAME: vidstream
  SPRING_DATASOURCE_PASSWORD: ${VIDSTREAM_DB_PASSWORD:?}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      VIDSTREAM_DB_PASSWORD: ${VIDSTREAM_DB_PASSWORD:?}
      LS_DEV_DB_PASSWORD: ${LS_DEV_DB_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 30s

  web:
    <<: *server
    environment:
      <<: *server-env
      VIDSTREAM_ROLE: web

  worker:
    <<: *server
    environment:
      <<: *server-env
      VIDSTREAM_ROLE: worker

volumes:
  postgres:
