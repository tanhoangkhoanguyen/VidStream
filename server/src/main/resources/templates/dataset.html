<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${name} + ' · VidStream'">VidStream</title>
</head>
<body>
<p><a th:href="@{/}">All datasets</a></p>
<h1 th:text="${name}">dataset</h1>
<p th:if="${notice}" th:text="${notice}">notice</p>
<p><a th:href="${labelStudio}">Label in Label Studio</a></p>
<h2>Videos</h2>
<ul th:unless="${videos.isEmpty()}">
  <li th:each="v : ${videos}" th:text="|${v.key}: ${v.value}|">DISCOVERED: 1</li>
</ul>
<p th:if="${videos.isEmpty()}">No videos yet: scan the Box folder.</p>
<!--/* Finds new videos in the Box folder; th:action adds the CSRF token. */-->
<form th:action="@{/datasets/{name}/scan(name=${name})}" method="post">
  <button type="submit">Scan Box folder</button>
</form>
</body>
</html>
