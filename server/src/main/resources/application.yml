spring:
  application:
    name: vidstream
  profiles:
    # Role = profile (web or worker). Startup fails when vidstream.role is unset.
    active: ${vidstream.role}
  threads:
    virtual:
      enabled: true
logging:
  structured:
    format:
      console: ecs
management:
  server:
    # Internal only: the proxy routes the app port, never this one.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
