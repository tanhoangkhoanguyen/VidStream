server:
  # Behind Caddy: redirect URIs use the public scheme and host from X-Forwarded-*.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 8h
      cookie:
        # Not Label Studio's "sessionid".
        name: vs_session
        # Parent domain: the gate on <dataset>.<domain> must see the cookie.
        domain: ${vidstream.domain}
        # Absolute lifetime: Box membership is re-checked at least every 8 h.
        max-age: 8h
        http-only: true
        secure: true
        same-site: lax
spring:
  security:
    oauth2:
      client:
        registration:
          box:
            client-id: ${BOX_CLIENT_ID}
            client-secret: ${BOX_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # Register it in the Box app: https://<domain>/login/oauth2/code/box
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          box:
            authorization-uri: https://account.box.com/api/oauth2/authorize
            token-uri: https://api.box.com/oauth2/token
            user-info-uri: https://api.box.com/2.0/users/me
            user-name-attribute: id
