# Label Studio (deploy/label-studio) is upgraded by hand: its patch must be re-checked.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
